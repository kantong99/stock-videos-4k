name: Render videos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (cepat, 720p-like) atau final-4k"
        type: choice
        options:
          - preview
          - final-4k
        default: preview

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Tentukan tag dan buat release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
          MODE: ${{ inputs.mode }}
        run: |
          TAG="videos-${RUN_NO}"
          PRE=""
          if [ "$MODE" = "preview" ]; then
            TAG="videos-${RUN_NO}-preview"
            PRE="--prerelease"
          fi
          printf '%s\n' "Render otomatis dari run #${RUN_NO} (mode: ${MODE})." > notes.md
          gh release create "$TAG" --repo "$REPO" $PRE \
            --title "Video render run #${RUN_NO} (${MODE})" \
            --notes-file notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scene: [car, silk, terrain, aurora, hex, ridges]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cek scene
        run: |
          test -f scenes/${{ matrix.scene }}.js || { echo "scenes/${{ matrix.scene }}.js tidak ada"; exit 1; }
          ffmpeg -version | head -n 1

      - name: Render ${{ matrix.scene }}
        run: |
          if [ "$MODE" = "preview" ]; then
            node render.js --scene "${{ matrix.scene }}" --seconds 4 --fps 30 --preview true
          else
            node render.js --scene "${{ matrix.scene }}" --seconds 20 --fps 30 --size 3840x2160 --preview false
          fi
          ls -lh out/

      - name: Upload ke release
        run: |
          gh release upload "$TAG" out/*.mp4 --repo "$REPO" --clobber
